[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pisell-merchant-profile-agent"
version = "0.3.5"
description = "A standalone, API-first merchant profile collection agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "PiSell"}]
dependencies = []

[project.optional-dependencies]
feishu = ["lark-channel-sdk>=1.4,<2"]

[project.scripts]
merchant-profile-agent = "merchant_profile_agent.__main__:main"
merchant-profile-feishu-bot = "merchant_profile_agent.feishu_bot_main:main"

[tool.setuptools.packages.find]
where = ["src"]
